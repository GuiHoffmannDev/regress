[project]
name = "regress"
version = "0.1.0"
description = "Regression detection for LLM-powered features: golden dataset evals, diffing, drift alerts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40,<3",
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
regress = "regress.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["regress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
